# office-ci - the office's own truth artery (zai-code-3, E-series, owner mandate:
# "the office in fleet is very important - it must serve the network, improve
# itself and always work"). Honest verdict law: PASS requires install + prisma
# + typecheck + build to each RUN and PASS; partial = BLOCKED = exit 1; FAIL
# receipts land too (honesty before comfort). Public repo = free Actions minutes.

name: office-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * *"

permissions:
  contents: write

concurrency:
  group: office-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Init checks
        run: |
          mkdir -p /tmp/checks
          for c in install prismaGenerate typecheck productionBuild connectivityAudit; do
            echo "skipped" > "/tmp/checks/$c"
          done

      - name: Install (frozen lockfile)
        if: always()
        run: |
          if bun install --frozen-lockfile; then echo "pass" > /tmp/checks/install; else echo "fail" > /tmp/checks/install; exit 1; fi

      - name: Prisma generate
        if: always()
        run: |
          if bunx prisma generate; then echo "pass" > /tmp/checks/prismaGenerate; else echo "fail" > /tmp/checks/prismaGenerate; exit 1; fi

      - name: Typecheck
        if: always()
        run: |
          if bunx tsc --noEmit; then echo "pass" > /tmp/checks/typecheck; else echo "fail" > /tmp/checks/typecheck; exit 1; fi

      - name: Production build
        if: always()
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          if bunx next build --webpack; then echo "pass" > /tmp/checks/productionBuild; else echo "fail" > /tmp/checks/productionBuild; exit 1; fi

      - name: Connectivity audit (the office asks what is NOT connected — zai-14)
        if: always()
        run: |
          if node tools/connectivity-audit.mjs; then echo "pass" > /tmp/checks/connectivityAudit; else echo "fail" > /tmp/checks/connectivityAudit; exit 1; fi

      - name: Write receipt (honest, always)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const read = (n) => (fs.existsSync("/tmp/checks/" + n) ? fs.readFileSync("/tmp/checks/" + n, "utf8").trim() : "missing");
          const checks = {};
          for (const c of ["install", "prismaGenerate", "typecheck", "productionBuild", "connectivityAudit"]) checks[c] = read(c);
          const values = Object.values(checks);
          const allPass = values.length === 5 && values.every((v) => v === "pass");
          const anySkipped = values.some((v) => v !== "pass" && v !== "fail");
          const overall = allPass ? "PASS" : anySkipped ? "BLOCKED" : "FAIL";
          const reason = allPass
            ? "all five checks ran and passed"
            : anySkipped
              ? "partial run: a check never executed - skipped is never pass"
              : "failing checks: " + Object.entries(checks).filter(([, v]) => v === "fail").map(([k]) => k).join(",");
          const receipt = {
            schema: "office.ci/1",
            at: new Date().toISOString(),
            repo: process.env.REPO,
            sha: (process.env.SHA || "").slice(0, 12),
            checks,
            overall,
            reason,
            provenance: {
              runId: process.env.RUN_ID,
              runUrl: "https://github.com/" + process.env.REPO + "/actions/runs/" + process.env.RUN_ID,
              sha: process.env.SHA,
            },
          };
          fs.mkdirSync("receipts/office-ci", { recursive: true });
          fs.writeFileSync("receipts/office-ci/verdict.json", JSON.stringify(receipt, null, 1) + "\n");
          fs.appendFileSync("receipts/office-ci/log.jsonl", JSON.stringify({ at: receipt.at, overall, checks }) + "\n");
          console.log("OFFICE-CI", overall, "-", reason);
          EOF

      - name: Publish receipt (sibling-stand-down + snapshot/re-apply push x8, backoff+jitter)
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          # Snapshot THIS run's measured receipt payload before the tree is
          # touched — the publish re-applies exactly this, never regenerates.
          SNAP=/tmp/publish-snap
          rm -rf "$SNAP"; mkdir -p "$SNAP/receipts/office-ci" "$SNAP/office/state"
          cp -a receipts/office-ci/. "$SNAP/receipts/office-ci/" 2>/dev/null || true
          cp -a office/state/connectivity.json "$SNAP/office/state/" 2>/dev/null || true
          sibling_stand_down() {
            # duplicate trigger law: a sibling run of the SAME sha may have
            # already published the receipt — that is a WIN, not a failure.
            git fetch -q origin main 2>/dev/null || return 1
            if git show origin/main:receipts/office-ci/verdict.json 2>/dev/null | grep -q "\"sha\": \"${GITHUB_SHA:0:12}\""; then
              echo "SIBLING-STAND-DOWN: receipt for $GITHUB_SHA already published — honest exit 0"
              return 0
            fi
            return 1
          }
          # publish_once: rebuild the commit on top of fresh origin/main.
          # No rebase → no deterministic conflict: when a sibling (different
          # sha) already rewrote the shared receipt paths, latest-wins files
          # (verdict.json, connectivity.json) take this run's fresher
          # measurement and the append-only log unions both (dedup exact
          # lines). Push is FF-only; a rejection (origin moved again) retries.
          publish_once() {
            mkdir -p receipts/office-ci office/state
            git show origin/main:receipts/office-ci/verdict.json > receipts/office-ci/verdict.json 2>/dev/null || : > receipts/office-ci/verdict.json
            git show origin/main:receipts/office-ci/log.jsonl   > receipts/office-ci/log.jsonl   2>/dev/null || : > receipts/office-ci/log.jsonl
            git show origin/main:office/state/connectivity.json > office/state/connectivity.json 2>/dev/null || : > office/state/connectivity.json
            cp -a "$SNAP/receipts/office-ci/verdict.json" receipts/office-ci/verdict.json 2>/dev/null || true
            cat "$SNAP/receipts/office-ci/log.jsonl" >> receipts/office-ci/log.jsonl 2>/dev/null || true
            cp -a "$SNAP/office/state/connectivity.json" office/state/connectivity.json 2>/dev/null || true
            awk 'NF && !seen[$0]++' receipts/office-ci/log.jsonl > receipts/office-ci/log.jsonl.tmp && mv receipts/office-ci/log.jsonl.tmp receipts/office-ci/log.jsonl
            git add receipts/office-ci/ office/state/connectivity.json
            if git diff --cached --quiet; then return 2; fi
            git commit -q -m "office-ci receipt: build $(cat /tmp/checks/productionBuild 2>/dev/null || echo unknown), types $(cat /tmp/checks/typecheck 2>/dev/null || echo unknown) [skip ci]" || return 1
            git push -q origin main
          }
          ok=0
          # fleet hot-race: siblings push receipts continuously — 8 attempts,
          # growing backoff + jitter absorb the race. Every attempt re-fetches
          # and re-applies from the snapshot; never force, never drops history.
          for i in 1 2 3 4 5 6 7 8; do
            if ! git fetch -q origin main; then sleep $((2 * i + RANDOM % 4)); continue; fi
            if sibling_stand_down; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git reset -q --hard origin/main
            # wave-19.34 (measured 19:16:06Z failure): GitHub runs steps under
            # `bash -e` — `publish_once; rc=$?` let a push REJECTION kill the
            # whole step instantly, so this 8-attempt race loop never actually
            # retried the exact race it was built for (one "remote rejected"
            # → 0.01s later exit 1, zero retries in the log). The `|| rc=$?`
            # idiom makes the failure condition-safe so the loop below can do
            # what its own comment promises: absorb sibling races with
            # backoff. Every attempt still re-fetches and re-applies from the
            # snapshot; never force, never drops history.
            rc=0; publish_once || rc=$?
            if [ "$rc" = "0" ]; then ok=1; echo "PUSH-OK attempt $i"; break; fi
            if [ "$rc" = "2" ]; then ok=1; echo "no receipt delta (origin already holds this payload) — honest exit 0"; break; fi
            if sibling_stand_down; then ok=1; break; fi
            sleep $((2 * i + RANDOM % 4))
            echo "push attempt $i failed (rc=$rc), retrying"
          done
          if [ "$ok" != "1" ]; then sibling_stand_down || { echo "PUSH-FAILED after retries — verdict honest but unpublished"; exit 1; }; fi

      - name: Verdict gate (red unless PASS)
        if: always()
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const v = JSON.parse(fs.readFileSync("receipts/office-ci/verdict.json", "utf8"));
          console.log("gate:", v.overall, "-", v.reason, "-", v.provenance.runUrl);
          if (v.overall !== "PASS") process.exit(1);
          EOF
