# office-window.yml — החלון היומי של מפקדת הצי: דיג'סט-צי + רינדור + פרסום ל-office-pages.
# Lane: zai-10a (owner mandate trace 1a12…c355) — new-files lane only.
# Zero secrets: the only credential is the built-in GITHUB_TOKEN (contents:write).
# Honesty: any collection failure degrades to "unknown" in digest.json — never fake green.
name: office-window

on:
  schedule:
    - cron: "17 6 * * *"   # primary daily 06:17 UTC (odd minute — fleet cron hygiene; NOT guaranteed alone — GitHub drops schedule slots under load, measured)
    - cron: "41 9 * * *"   # backstop 09:41 UTC — second chance
    - cron: "3 14 * * *"   # backstop 14:03 UTC — third chance
    - cron: "29 21 * * *"  # backstop 21:29 UTC — fourth chance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: office-pages-publish
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history — branch switch + rebase needed)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fleet digest (read-only GitHub API + public raw docs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node office-window/fleet-digest.mjs --out office-window/dist/digest.json

      - name: Render office window page (standalone RTL Hebrew page)
        run: node office-window/render.mjs --digest office-window/dist/digest.json --out office-window/dist/index.html

      - name: Potential ledger (measured open work + recruiting board — fail→unknown)
        run: node tools/potential.mjs --digest office-window/dist/digest.json --dist office-window/dist

      - name: Publish dist to office-pages (rebase-first, no force-push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash office-window/publish.sh

      - name: Honest job summary
        if: always()
        run: |
          {
            echo "## office-window — daily render"
            echo ""
            if [ -f office-window/dist/digest.json ]; then
              node -e "const d=require('./office-window/dist/digest.json');console.log('- generatedAt:',d.generatedAt);console.log('- tokenMode:',d.tokenMode);console.log('- repos measured:',d.fleet&&d.fleet.reposSeen);console.log('- grid verdict:',(d.grid&&d.grid.verdict)||'unknown');console.log('- hive verdict:',(d.grid&&d.grid.hive&&d.grid.hive.verdict)||'unknown');console.log('- API calls failed:',d.errors?d.errors.length:0);"
            else
              echo "- digest.json MISSING — fleet section rendered as unknown (honest)"
            fi
            echo "- page: https://roshpinacare-sys.github.io/FleetHQ/"
            echo "- rule: unknown stays unknown — never fake green"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Freshness gate — fail loud if the published potential is stale
        if: always()
        run: |
          # Reads the artifact the publish step just pushed (office-pages branch tip —
          # propagates immediately; Pages CDN lag + its misleading Last-Modified header
          # are a separate failure domain). Age > 26h = the daily generator dropped its
          # slots → this run must exit 1 so the freeze is loud, never a silent green.
          node -e "fetch('https://raw.githubusercontent.com/roshpinacare-sys/FleetHQ/office-pages/potential.json?cb='+Date.now()).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(p=>{if(!p.generatedAt)throw new Error('generatedAt missing');const h=(Date.now()-Date.parse(p.generatedAt))/36e5;console.log('potential.json age='+h.toFixed(1)+'h (generatedAt '+p.generatedAt+')');if(h>26){console.error('STALE — daily generator dropped its slots; investigate office-window runs');process.exit(1);}}).catch(e=>{console.error('freshness gate probe failed:',e.message);process.exit(1);})"
          # [agent-zai/G4] symmetric probe: the fleet digest is the signal grid-watchdog measures
          # (fleetdigest.fresh) — a silent digest freeze must fail this run loud, same 26h law.
          node -e "fetch('https://raw.githubusercontent.com/roshpinacare-sys/FleetHQ/office-pages/digest.json?cb='+Date.now()).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()}).then(p=>{if(!p.generatedAt)throw new Error('generatedAt missing');const h=(Date.now()-Date.parse(p.generatedAt))/36e5;console.log('digest.json age='+h.toFixed(1)+'h (generatedAt '+p.generatedAt+')');if(h>26){console.error('STALE — fleet digest frozen; investigate fleet-digest.mjs step');process.exit(1);}}).catch(e=>{console.error('digest freshness gate probe failed:',e.message);process.exit(1);})"
