# agent-9/t55s: Actions-based Pages deployment for FleetHQ.
# Site source is the office-pages BRANCH (measured 2026-10-22: main root has no
# index.html; office-pages carries the full site). This workflow checks out
# office-pages and deploys its root — the migration POST had reset the source
# to main/root which 404'd; this restores the correct content path under
# build_type=workflow (source fields are ignored in workflow mode; the artifact is the truth).
name: pages-deploy

on:
  push:
    branches:
      - main
      - office-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: office-pages
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true
      - id: dep
        uses: actions/deploy-pages@v4
