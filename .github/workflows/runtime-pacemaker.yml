# runtime-pacemaker — קצב-הלב שלא נשען על ה-scheduler של הפלטפורמה.
# ═════════════════════════════════════════════════════════════════════════════
# מדידה (מפקד 2026-10-12): ה-scheduler של GitHub יורה נאמן על הריפו הוותיקים
# (Console 2,500 הרצות schedule · saos-runtime · FleetHQ) ומשתיק 100% מה-crons
# על ריפו-הריצה החדשים (Autonomy · Pulse · GridWatch: אפס הרצות schedule מעולם,
# עם crons מוגדרים ו-workflows active). התוצאה: מוח-הריצה פועם רק כשסשן-סוכן
# ער — בדיוק ה"רשת מכבה את עצמה" שאובחנה.
#
# התשובה ההנדסית (בלי אמון בפלטפורמה, בלי סנדבוקס, בלי סוכן ער):
#   SENSE  — גיל הרצה-אחרונה של כל עורק קריטי, דרך ה-API.
#   DECIDE — גיל > SLA (2x הקצב הנומינלי) וההרצה האחרונה לא בעיצומה => העורק מאחר.
#   ACT    — workflow_dispatch דרך CROSS_REVIVE_PAT (הרשות-המואצלת של הרשת,
#            כבר בשימוש opens-closer). מוגבל ל-8 הצתות למחזור — בלי self-DoS.
#   RECORD — קבלה כנה אחת למחזור ב-pacemaker/state/beats.jsonl (קומיט בגיט =
#            הוכחה גלויה). אם הקבלה מפסיקה להתעדכן — הפצמר עצמו מת; גם זה נאזעק.
#
# חוקי-כנות: לעולם לא לזייף הצתה; עורק שנכשל נשאר אדום על הלוח שלו — הפצמר
# מצית, לא משתיק; DRYRUN=1 מודד ומדווח בלי להצית.
# ═════════════════════════════════════════════════════════════════════════════
name: runtime-pacemaker

on:
  schedule:
    # שלוש שורות staggered — האיחוד יורה כל ~5 דקות; דקות-אי-זוגיות מפחיתות תחרות
    - cron: "6,26,46 * * * *"
    - cron: "11,31,51 * * * *"
    - cron: "17,37,57 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [pacemaker-tick]
  # עוגן-אירוע (חוק-הענקים: לעולם לא מקור-קצב יחיד): ה-scheduler מדליק schedules
  # ישנים אבל משתיק רישום-של-workflows-חדשים (נמדד: 3 מחזורי-cron של-workflow-חדש
  # הוחמצו). workflow_run הוא טריגר-אירוע — לא-תלוי-רישום-scheduler. כל סיום של
  # lanes ותיקים-שמוכח-שהם-יורים מזניק מחזור-פצמר — הקצב לעולם לא נשען רק על cron.
  workflow_run:
    workflows: [value-scan, sovereign-decider, opens-closer, office-heartbeat, office-ci, sovereign-selfscan, claims-triage, sovereign-policy-gate, sovereign-harness, sovereign-identity, self-book, identity-patrol]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runtime-pacemaker
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: SENSE late arteries -> IGNITE (CROSS_REVIVE_PAT) -> RECORD receipt
        env:
          CROSS_REVIVE_PAT: ${{ secrets.CROSS_REVIVE_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/pacemaker.mjs

      # קומיט-ממושפע: קבלה בלבד (אף-פעם לא -A) · rebase ×3 · כשל = יציאה 1
      - name: commit receipt (honest, rebase x3)
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add pacemaker/state/beats.jsonl
          if git diff --cached --quiet; then
            echo "receipt unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "pacemaker receipt: $(date -u +%FT%TZ)"
          OK=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin main && git push origin main; then OK=1; echo "push ok (attempt $i)"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$OK" = "1" ] || { echo "receipt push failed after 3 attempts — honest failure"; exit 1; }
