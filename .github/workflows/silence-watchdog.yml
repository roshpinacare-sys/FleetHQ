# silence-watchdog.yml — the alarm channel that survives the sandbox.
#
# The local silence-ledger measures the estate from inside the box; when the
# box dies (3 wipes on 2026-10-12) nothing speaks. THIS workflow runs on
# GitHub Actions, measures PUBLIC truth (origin commits, the sandbox voice
# heard through git, live Pages receipts), and speaks through GitHub Issues
# — GITHUB_TOKEN only, zero secrets, zero sandbox dependency. Owner sees
# alarms by email; the issue closes itself on recovery. Meta-law: if this
# issue/receipt stops updating, the watchdog itself is dead — that too is
# an alarm (the receipt age at origin is the meta-voice).
name: silence-watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: silence-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Measure every visible voice + alarm through Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/silence-watchdog.mjs
