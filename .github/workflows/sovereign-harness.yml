# sovereign-harness — Layer 3 of the Ultimate Sovereign Stack (aeon-pattern runtime).
# The unattended loop organ: scores every workflow in the network STATE (bounded
# API deepening for criticals), files deduped skill-repair proposals (runaway
# guard at >10 open), and serves the estate's MCP tool edge over issue-label
# transport (mcp-invoke -> in-thread answer -> mcp-done). Bounded by Layer 2:
# policy.json autonomy.autoApply=disabled — proposals only, never rewrites.
# Measurement duty -> exit 0. Ref: GOVERNANCE/sovereign-stack.md

name: sovereign-harness

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sovereign-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Score the fleet (skill-health)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: node sovereign/stack/runtime/run-scores.mjs

      - name: Self-heal proposals (skill-repair, deduped, runaway-guarded)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: node sovereign/stack/runtime/self-heal.mjs

      - name: Serve the MCP edge (issue-label transport)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: node sovereign/stack/runtime/mcp/mcp-router.mjs

      - name: Publish scores + skills (defer-not-fail, rebase-before-push)
        env:
          PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: |
          set -uo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "roshpinacare-sys@users.noreply.github.com"
          if [ -n "${PAT:-}" ]; then git remote set-url origin "https://roshpinacare-sys:${PAT}@github.com/roshpinacare-sys/FleetHQ.git"; fi
          git add sovereign/stack/runtime ops/claims ops/decisions.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no harness changes"; exit 0; fi
          git commit -m "harness: scores + repair proposals + mcp edge" || exit 0
          PUBLISHED=0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main >/dev/null 2>&1; then PUBLISHED=1; echo "published on attempt $i"; break; fi
            sleep $((8 + RANDOM % 11))
          done
          if [ "$PUBLISHED" = "1" ]; then echo "harness books published"; else echo "PUBLISH-DEFERRED: named terminal publish-deferred — exit 0 per anti-storm law"; fi
          exit 0
