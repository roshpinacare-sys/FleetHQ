# sovereign-policy-gate — Layer 2 of the Ultimate Sovereign Stack (PolicyAVS).
# The validator network in the flesh: reads the LIVE capital books from Domain
# (xc intents + dex tape, public raw fetch, keyless), validates every recent
# intent/fill against policy.json hard whitelists/ceilings, composes the STASIS
# brake (active => every verdict ESCALATE), publishes verdicts.json, files ONE
# deduped issue per violation signature. Refuse-to-sign + quarantine = our
# slashing analogue. Measurement duty -> exit 0. Ref: GOVERNANCE/sovereign-stack.md

name: sovereign-policy-gate

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sovereign-policy-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Policy engine selftest (12 vectors — a test MAY fail loudly)
        run: node sovereign/stack/policy/policy-engine.mjs --selftest

      - name: Gate the live capital books (exit 0 always)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: node sovereign/stack/policy/policy-gate.mjs

      - name: Publish verdicts (defer-not-fail, rebase-before-push)
        env:
          PAT: ${{ secrets.SOVEREIGN_PAT }}
        run: |
          set -uo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "roshpinacare-sys@users.noreply.github.com"
          if [ -n "${PAT:-}" ]; then git remote set-url origin "https://roshpinacare-sys:${PAT}@github.com/roshpinacare-sys/FleetHQ.git"; fi
          git add sovereign/stack/policy/verdicts.json ops/claims 2>/dev/null || true
          if git diff --cached --quiet; then echo "no verdict changes"; exit 0; fi
          git commit -m "policy-gate: verdicts on the live capital books (stasis=$(node -e "try{const v=require('./sovereign/stack/policy/verdicts.json');process.stdout.write(String(v.stasis.active))}catch{process.stdout.write('?')}"))" || exit 0
          PUBLISHED=0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main >/dev/null 2>&1; then PUBLISHED=1; echo "published on attempt $i"; break; fi
            sleep $((8 + RANDOM % 11))
          done
          if [ "$PUBLISHED" = "1" ]; then echo "verdicts published"; else echo "PUBLISH-DEFERRED: named terminal publish-deferred — exit 0 per anti-storm law"; fi
          exit 0
