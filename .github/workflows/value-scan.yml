# value-scan.yml — T-59: סריקת-ערך אוטונומית על הגיט, כל 30 דק' (החוזה ש-worlds/RecruitmentBoard מכריז עליו).
# אפס סודות: קריאת קבצי-עבודה + raw keyless פומבי בלבד; ההרשאה היחידה GITHUB_TOKEN (contents:write).
# כנות: סריקה שנכשלה → אין קובץ, אין פרסום; אין דלתא-תוכן → אין קומיט (מונע רעש).
name: value-scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: value-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history — needed for delta check)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan value from measured evidence (keyless, additive)
        run: node tools/value-scan.mjs

      - name: Commit scan (append-only, rebase-first, no force)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add office/state/value-scan.json
          if git diff --cached --quiet; then echo "no-delta: nothing to commit"; exit 0; fi
          git commit -m "value-scan: opportunities from measured evidence [skip ci]"
          ok=0
          for i in 1 2 3; do
            if git push -q origin main; then ok=1; echo "PUSH-OK attempt $i"; break; fi
            echo "push attempt $i failed — rebase and retry"
            git pull --rebase -X theirs --autostash -q origin main || true
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "PUSH-FAILED after retries"; exit 1; fi

      - name: Schedule relay — guarded dispatch to opens-closer + sovereign-decider (T-64)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          relay() {
            local wf="$1" guard="$2"
            local last
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null || echo "")
            if [ -z "$last" ]; then
              gh workflow run "$wf" --ref main && echo "RELAY[$wf]: DISPATCHED (no last run found)" || echo "RELAY[$wf]: FAILED"
              return
            fi
            local age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
            if [ "$age" -ge "$guard" ]; then
              gh workflow run "$wf" --ref main && echo "RELAY[$wf]: DISPATCHED (last run ${age}min ago >= guard ${guard}min)" || echo "RELAY[$wf]: FAILED"
            else
              echo "RELAY[$wf]: SKIPPED (last run ${age}min ago < guard ${guard}min — no-noise)"
            fi
          }
          relay "opens-closer.yml" 15
          relay "sovereign-decider.yml" 15

      - name: Honest job summary
        if: always()
        run: |
          {
            echo "## value-scan — opportunities from measured evidence"
            if [ -f office/state/value-scan.json ]; then
              node -e "const j=require('./office/state/value-scan.json');console.log('- generatedAt:',j.generatedAt);console.log('- opportunities:',(j.opportunities||[]).length);console.log('- verdict:',j.verdictHe);console.log('- metrics:',JSON.stringify(j.metrics))"
            else
              echo "- scan file MISSING — the scan failed; nothing published (honest fallback, never fake)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
