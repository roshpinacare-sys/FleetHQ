name: forge
# איבר-הביצוע של הצי — כל 30 דק — קריאת-התור, בעלות, ביצוע מתכונים דטרמיניסטיים, קבלות, הסלמות.
# נגד-תקיעה — timeout קשיח + אימות-קומיט-מזהה בסוף הריצה (forge.mjs מסיים בקוד-שגיאה אם האימות נכשל).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge
  cancel-in-progress: false
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: READ -> CLAIM -> EXECUTE -> RECEIPT -> ESCALATE
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node tools/forge.mjs
