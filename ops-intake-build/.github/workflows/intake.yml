name: intake
# צינור-הקליטה התפעולי — כל 30 דק — מדידה, תור-עבודות, מפת-מרחב, הסלמות P0.
# נגד-תקיעה — timeout קשיח + אימות-קומיט-מזהה בסוף הריצה (intake.mjs מסיים בקוד-שגיאה אם האימות נכשל).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SENSE -> DECIDE -> RECORD -> ESCALATE
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node tools/intake.mjs
