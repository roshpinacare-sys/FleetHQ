#
#
#

name: anchor-execute

on:
  schedule:
    - cron: '8 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-execute
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ethers (signing path only)
        run: npm install ethers@6.13.4 --prefix /tmp/ethers --omit=dev --no-audit --no-fund --loglevel=error

      - name: Run anchor-execute (DRYRUN without a signing key — the script itself is the honest gate)
        env:
          ETHERS_DIR: /tmp/ethers
          EVM_ANCHOR_PK: ${{ secrets.EVM_ANCHOR_PK }}
          CHAIN: OPTIMISM
          RECEIPT_OUT: /tmp/anchor-receipt.json
        run: node agents/anchor-execute.mjs

      - name: Checkout the public book (receipt lands here on a real anchor)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Console
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          path: console-book
          fetch-depth: 1

      - name: Commit receipt (only if the run produced one — file-existence gate, not a secrets gate)
        run: |
          set -u
          test -f /tmp/anchor-receipt.json || { echo "no receipt — hourly DRYRUN as designed"; exit 0; }
          cd console-book
          cp /tmp/anchor-receipt.json proof/anchor-receipt.json
          git config user.name "anchor-execute[bot]"
          git config user.email "anchor-execute[bot]@users.noreply.github.com"
          git add proof/anchor-receipt.json
          git commit -m "anchor-execute: first EVM anchor of the fleet — receipt + independent read-back [skip ci]"
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
