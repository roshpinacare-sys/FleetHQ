#
# The owner demanded a networked arbitrage market for the agents and the soldiers —
# a wide volume of REAL trades and profits on our own network, and routers that can
# settles ATOMICALLY — batch-idempotent, no naked shorts, wires capped at 10% of free
# The size ladder quotes exact BigInt at 0.1%/1%/5% of depth — the large-sums capability,
# measured, not promised.
#

name: arb-mesh

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arb-mesh
  cancel-in-progress: false

jobs:
  mesh-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: arb-mesh selftest (fresh process, zero network — the drafting laws judge themselves first)
        run: node agents/arb-mesh.cjs selftest

      - name: dex-core selftest (the settlement engine the mesh leans on)
        run: node agents/dex-core.cjs selftest

      - name: uniform batch clearing selftest (R76 · the CoW take judges itself — one price, order-invariance, netting, minOut exclusion)
        run: node agents/dex-core.cjs selftest-batch

      - name: approved settlement selftest (R77 · the owner-gate lane judges itself — CR-0075 gate, staged-lane, conservation, idempotency, order-invariance)
        run: node agents/dex-core.cjs selftest-batch-settle

      - name: engine fee-law selftest (R77 · the Meteora take judges itself — measured σ, caps, pegs untouched, no invention)
        run: node agents/dex-core.cjs selftest-fee-law

      - name: mesh tick (mandates → intents queue → atomic settle → honest P&L + size ladder)
        run: node agents/arb-mesh.cjs

      - name: uniform batch clearing proof (R76 · DRY lane — measures the queue as ONE batch, publishes agents/dex-batch.json, moves nothing)
        run: node agents/dex-core.cjs clear-batch

      - name: engine fee-law tick (R77 · the Meteora take adopted by the ENGINE — σ measured from our own books only, publishes agents/fee-law.json)
        run: node agents/dex-core.cjs fee-law

      - name: approved batch settlement tick (R77 · the CR-0075 lane — publishes agents/dex-batch-settled.json in EVERY state, the owner gate trace is auditable on Pages)
        run: node agents/dex-core.cjs settle-batch

      - name: commit mesh books (+ the core ledger when a batch settled, + the batch-clear proof book)
        run: |
          git config user.name "saos-arb-mesh"
          git config user.email "arb-mesh@fleet.local"
          node agents/redact-telemetry.mjs agents/arb-mesh.json agents/dex-intents.json agents/dex-core.json agents/fee-law.json agents/dex-batch.json || true
          git add agents/arb-mesh.json agents/arb-mesh.md agents/arb-mesh-history.jsonl agents/dex-intents.json agents/dex-core.json agents/dex-core.md agents/dex-core-history.jsonl agents/dex-batch.json agents/fee-law.json agents/dex-batch-settled.json
          if git diff --cached --quiet; then
            echo "no book delta — quiet tick"
          else
            git commit -m "arb-mesh: mesh-market tick $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main && break
              echo "rebase-push retry $i"; sleep $((i * 5))
            done
          fi
