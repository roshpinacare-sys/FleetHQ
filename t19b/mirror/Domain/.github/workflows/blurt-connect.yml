name: blurt-connect
on:
  schedule: [{cron: '27 5 * * *'}]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONNECT to execute (safety friction)'
        required: true
        default: 'CONNECT'
permissions:
  contents: write
concurrency:
  group: blurt-connect
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: confirm friction
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm }}" != "CONNECT" ]; then
            echo "CONFIRM-REFUSED — type CONNECT to execute"; exit 1
          fi
      - name: install signer lib (house pattern)
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          npm install --prefix /tmp/steemjs @blurtfoundation/blurtjs --omit=dev --no-audit --no-fund --loglevel=error
      - name: blurt connectivity bootstrap (additive posting auth + verification post)
        env:
          BLURT_ACTIVE_WIF: ${{ secrets.BLURT_ACTIVE_WIF }}
          BLURT_POSTING_WIF: ${{ secrets.BLURT_POSTING_WIF }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
        run: NODE_PATH=/tmp/steemjs/node_modules node agents/blurt-connect.cjs
      - name: commit state + book
        if: always()
        run: |
          git config user.name "blurt-connect[bot]"
          git config user.email "blurt-connect[bot]@users.noreply.github.com"
          git add agents/blurt-connect-state.json agents/blurt-connect-book.md
          if git diff --cached --quiet; then echo "no connect changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "blurt-connect: connectivity run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            git push origin main >/dev/null 2>&1 || true
          fi
