#

name: bootstrap-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-pages.yml"]

permissions:
  pages: write
  contents: read

concurrency:
  group: bootstrap-pages
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure GitHub Pages (deploy from main, root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          GET_CODE=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pages")
          echo "GET HTTP ${GET_CODE}"
          if [ "$GET_CODE" = "200" ]; then
            echo "PAGES ALREADY LIVE - site measured built from $(cat /tmp/pages-get.json | grep -o '"status": *"[^"]*"' | head -1)"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "POST HTTP ${CODE}"
          cat /tmp/pages-out.json || true
          echo ""
          case "$CODE" in
            201) echo "PAGES ENABLED - the site will deploy from main"; exit 0;;
            409) echo "PAGES ALREADY ENABLED"; exit 0;;
            403) echo "GITHUB_TOKEN cannot create a Pages site (API limitation, measured) - enable once manually: Settings > Pages > Deploy from a branch (main, / (root))"; exit 1;;
            *) echo "FAILED - enable manually: Settings > Pages > Deploy from a branch (main, / (root))"; exit 1;;
          esac
