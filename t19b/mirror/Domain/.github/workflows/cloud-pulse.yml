name: cloud-pulse

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry — read the chain, build the card, print it, broadcast nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloud-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (the public mirror + truth gate feed the card)
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Steem client (steem@0.7.11 — the exact package the sovereign home signs with)
        run: npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error

      - name: Daily truth card (cloud fallback when the sandbox pulse is silent)
        env:
          STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          STEEM_JS_DIR: /tmp/steemjs
          CLOUD_PULSE_DRY: ${{ inputs.dry && '1' || '' }}
        run: node agents/cloud-pulse.mjs
