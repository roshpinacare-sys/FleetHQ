name: cognition-beat
on:
  schedule: [{cron: '43 * * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: cognition-beat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: regenerate self-model from live measurements (shrink-only)
        run: node agents/cognition-beat.cjs
      - name: commit beat books
        run: |
          git config user.name "cognition-beat[bot]"
          git config user.email "cognition-beat[bot]@users.noreply.github.com"
          git add agents/cognition/organism.json agents/cognition/beat-book.md
          if git diff --cached --quiet; then echo "no beat changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "cognition-beat: self-model refreshed $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            git push origin main >/dev/null 2>&1 || true
          fi
