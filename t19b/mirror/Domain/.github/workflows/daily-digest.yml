#
#
#

name: daily-digest

on:
  schedule:
    - cron: '2 1 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry — build the digest, print it, broadcast nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout KPI source (Defi is private — read via vault PAT; honest skip if denied)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Defi
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          path: defi-kpi
          fetch-depth: 1

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Steem client (steem@0.7.11 — the home signing template)
        run: npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error

      - name: Daily mission digest (posting-only, measured, idempotent)
        env:
          STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          STEEM_JS_DIR: /tmp/steemjs
          DAILY_DIGEST_DRY: ${{ inputs.dry && '1' || '' }}
        run: node agents/daily-digest.mjs
