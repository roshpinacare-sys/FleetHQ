name: econ-desk
on:
  schedule: [{cron: '14 22 * * *'}]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: econ-desk
  cancel-in-progress: false
jobs:
  econ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: STASIS gate (mechanical, FATE-DEFENSE law
        id: brake
        run: |
          ST=$(node -p "JSON.parse(require('fs').readFileSync('agents/STASIS.json','utf8')).active===true")
          echo "active=$ST" >> "$GITHUB_OUTPUT"
          if [ "$ST" = "true" ]; then
            echo "STASIS-HALT econ-desk · the breaker is active — capital lanes obey (hive-engine market orders)"
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: "install signer (hive-js; R-ECON-3)"
        run: npm install @hiveio/hive-js --omit=dev --silent
      - name: "checkout private steem home (vault recovery path)"
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/steem
          token: ${{ secrets.WEAVE_OPS_PAT }}
          fetch-depth: 1
          path: steem-repo
      - name: "run econ desk"
        if: steps.brake.outputs.active != 'true'
        env:
          SA_FLEET_KEYS: ${{ secrets.SA_FLEET_KEYS }}
          STEEM_REPO_DIR: steem-repo
        run: node agents/econ-desk.cjs
      - name: commit book
        run: |
          git config user.name "econ-desk[bot]"
          git config user.email "econ-desk[bot]@users.noreply.github.com"
          node agents/redact-telemetry.mjs agents/econ-book.json || true
          git add agents/econ-book.json agents/econ-book.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "no book changes"; else
            for i in 1 2 3; do
              git -c rebase.autoStash=true pull --rebase origin main >/dev/null 2>&1 || true
              git commit -m "econ-desk: real-economy book $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" >/dev/null 2>&1 && break || sleep 5
            done
            for i in 1 2 3; do git push origin main >/dev/null 2>&1 && break || sleep 5; done
          fi
        continue-on-error: true
