#
# [zai-main-1a12d2e9] 2026-10-11 — WO-unwired-evo-windows (P2, Sandbox ops/office/work-orders.json):
# evo-windows.cjs (Z-62/CR-0033) had NO scheduler — measured via multi-clone grep (no workflow fires it);
# the book aged to 7-8d while agents/pulse.cjs consumes it as evidence (carry-law joins WINDOW-COMPLETE at
# any age; cadence state carried as CADENCE-ONLY). This workflow executes the WO acceptance: a weekly
# keyless run — ONE invocation = ONE decision (PULLED-SCHEDULE law), book committed back.
#
# CI LAW (measured, not assumed): in CI the desk runtime is absent (reef venv + zai-openai-shim source,
# measured 2026-10-11T23:05Z — host mini-services empty, zero repo hits), so decide() books
# SKIPPED-NO-DESK-RUNTIME from disk truth and never spawns the child — the CR-0030 desk's receipted book
# (agents/reef-harness-evo.json, winner evidence of the 2026-10-03 measured run) is NOT overwritten.
# A WINDOW-COMPLETE needs the desk runtime rebuilt (venv + shim source) — flagged to the fleet; until then
# this desk stays alive with honest skip rows and the pulse carries the cadence state honestly.
#
# Schedule minute (19 3 * * 0 = Sunday 03:19Z) computed free against agents/minute-map.json
# (one-minute-one-machine law, Z-70/Z-71).
#

name: evo-windows

on:
  schedule:
    - cron: '19 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evo-windows
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: One pulled-schedule decision (disk-truth booking; no env pre-decision)
        run: node agents/evo-windows.cjs

      - name: Publish the book
        if: always()
        run: |
          git config user.name "evo-windows"
          git config user.email "evo-windows@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add agents/evo-windows.json agents/evo-windows.md
            if git diff --cached --quiet; then
              echo "book unchanged - nothing to publish (attempt ${attempt})"
              exit 0
            fi
            git commit -m "evo-windows: one pulled-schedule decision $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase origin main
            if git push; then echo "book published (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-deciding"
            git reset --hard origin/main
            node agents/evo-windows.cjs
          done
          echo "ERROR: could not publish the evo-windows book after 3 attempts"
          exit 1
