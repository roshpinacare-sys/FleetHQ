# exposure-gate — P0-1 enforcement (master plan T6)
name: exposure-gate
on:
  push:
    branches: [main]
  schedule:
    - cron: '54 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: exposure-gate
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scan public surface
        id: scan
        run: node scripts/exposure-scan.mjs | tee exposure-scan-output.txt
      - name: File violation issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "exposure-gate: public-surface violation detected $(date -u +%F)" \
            --body "The exposure scan failed. See run ${{ github.run_id }}. Violations below — remove at HEAD and open a DecisionQueue item for history rewrite." \
            || echo "issue creation failed (non-fatal)"

