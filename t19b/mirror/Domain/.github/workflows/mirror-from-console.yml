#
#
#

name: mirror-from-console

on:
  workflow_dispatch:
  schedule:
    - cron: '48 1-23/2 * * *'
permissions:
  contents: write

concurrency:
  group: mirror-from-console
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror the truth outputs from Console (keyless public read)
        run: node agents/mirror-from-console.mjs

      - name: Publish the mirrored surfaces
        if: always()
        run: |
          git config user.name "mirror-from-console"
          git config user.email "mirror-from-console@users.noreply.github.com"
          node agents/redact-telemetry.mjs agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json weave/census.json weave/vitals.json weave/agreement.json
          git add agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json mirror-report.json weave/census.json weave/vitals.json weave/agreement.json
          if git diff --cached --quiet; then
            echo "mirror unchanged - the bloc books are already ours"
            exit 0
          fi
          for attempt in 1 2 3; do
            node agents/redact-telemetry.mjs agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json weave/census.json weave/vitals.json weave/agreement.json
            git add agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json mirror-report.json weave/census.json weave/vitals.json weave/agreement.json
            git commit -m "mirror-from-console: $(date -u +%Y-%m-%dT%H:%M:%SZ) · truth outputs mirrored from the Console home (one-bloc, keyless) [skip ci]"
            git pull --rebase origin main
            if git push; then echo "mirror published (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-mirroring"
            git checkout -- .
            git reset --hard origin/main
            node agents/mirror-from-console.mjs
            node agents/redact-telemetry.mjs agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json weave/census.json weave/vitals.json weave/agreement.json
            git add agents/registry.json agents/gh-snapshot.json dex/pnl-desk.json dex/money.json dex/deposits.json dex/watch.json truth/latest.json truth/history.json truth/slo.json mirror-report.json weave/census.json weave/vitals.json weave/agreement.json
            if git diff --cached --quiet; then
              echo "after re-mirror there is nothing to commit - the bloc books are already ours"
              exit 0
            fi
          done
          echo "ERROR: could not publish the mirror after 3 attempts"
          exit 1
