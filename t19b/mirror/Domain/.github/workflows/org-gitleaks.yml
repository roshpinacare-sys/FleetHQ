# ORG-GITLEAKS (Task 13-b, upgraded 13-d2) — סריקת-הסודות של כל-הארגון, מהבית-הציבורי
#
# האבחנה: כל-ה-Actions של הריפואים הפרטיים אדומים מאז 2026-09-20 (מכסת-הדקות
# אזלה, תיקון-ה-billing בבעלות-המפעיל — והמפעיל אישר שה-billing לא יתוקן).
# הסריקה הפרטית (gitleaks.yml בכל ריפו, binary-canonical v8.24.3) מתה עם הקווטה.
# התאום הזה מריץ **את אותה-הסריקה בדיוק** על כל-16 הריפואים מהבית-הציבורי
# Domain (דקות-Actions חינמיות ובלי-הגבלה לריפואים ציבוריים):
#   - checkout דרך ZIP_PAT (התבנית המוכחת — foundry-mesh-tests / sovereign-selftests)
#   - fetch-depth: 0 (היסטוריה מלאה — בדיוק כמו הסריקה הפרטית לכל-ריפו)
#   - gitleaks v8.24.3 pinned direct binary: curl from gitleaks releases
#
# שדרוג 13-d2 — פסק-דין כפול (history + HEAD):
#   - רגל א' (history): `detect --source .` על ההיסטוריה המלאה — ה-.gitleaksignore
#     של הריפו (triage 13-d2: false-positive / historical, owner-blocked rotation)
#     מוחל אוטומטית; מה שנשאר אחריו = ממצא היסטורי לא-מטופל (untriaged).
#   - רגל ב' (HEAD): `detect --no-git --source .` על עץ-ה-checkout בלבד —
#     חומר חי ב-HEAD היום. גם כאן ה-.gitleaksignore מוחל (טביעות-אצבע
#     בפורמט file:rule:line עבור ממצאי-ה-false-positive שקיימים ב-HEAD כרגיל-מעצב).
#   - סטטוס-רגל: {"findingsHistory", "findingsHead", "conclusion"} —
#     conclusion = failure אם ורק אם findingsHead>0 או findingsHistory>0
#     (היסטוריה לא-מטופלת אחרי ה-ignore). ירוק-כן רק כש-HEAD נקי וההיסטוריה מטופלת.
#   - ריפו עם ממצאים = הרגל שלו נכשלת (אדום-כן) בלי להפיל את שאר הרגליים
#     (fail-fast: false — המטריצה עושה זאת מעצמה)
# קבלות: אחרי המטריצה, receipts (if: always()) ממזג את סטטוסי-הרגליים לתוך
# receipts/gitleaks/STATUS.json (ספירות-בלבד, אפס-תוכן-סודות) ומצמיד קבלה
# בקונבנציית הבוטים (agents-watch): זהות gitleaks-hub[bot] + rebase-retry ×3.
#
# כנות: רגל-אחת אדומה לא מכסה על אחרת; רגל חסרה (missing) מפילה את הקבלה.
# אפס-סודות-מפעיל: ZIP_PAT בלבד. הקבלה מכילה ספירות-בלבד.

name: org-gitleaks

on:
  schedule:
    - cron: '44 5 * * 1' # R67-A: daily x14 repos -> weekly (Monday); PR triggers stay instant
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-gitleaks
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 13-e (R244): each leg judges the repo's LIVE line only — steem's canonical
        # line is saos-cockpit (default branch; its `main` is a stale orphan side-ref).
        include:
          - { repo: Adsmarket, ref: main }
          - { repo: Console, ref: main }
          - { repo: Domain, ref: main }
          - { repo: Defi, ref: main }
          - { repo: Project-files, ref: main }
          - { repo: Saosmartwallet, ref: main }
          - { repo: Sdk, ref: main }
          - { repo: Zip, ref: main }
          - { repo: anchor-baseline, ref: main }
          - { repo: roshpina, ref: main }
          - { repo: saos-control-center, ref: main }
          - { repo: saos-dex, ref: main }
          - { repo: saos-jummper, ref: main }
          - { repo: saos-sovereign-foundry, ref: main }
          - { repo: saos-sovereign-platform, ref: main }
          - { repo: steem, ref: saos-cockpit }
    steps:
      - name: Prepare leg status (pending until the scan overwrites it)
        if: always()
        env:
          REPO: ${{ matrix.repo }}
        run: |
          mkdir -p /tmp/gl-status
          python3 -c 'import json,sys; json.dump({"repo":sys.argv[1],"findingsHistory":None,"findingsHead":None,"conclusion":"pending"}, open(f"/tmp/gl-status/{sys.argv[1]}.json","w"))' "$REPO"

      - name: Checkout ${{ matrix.repo }} @ ${{ matrix.ref }} (full history)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 0
          path: scan

      - name: gitleaks dual verdict (direct pinned binary v8.24.3)
        id: scan
        env:
          REPO: ${{ matrix.repo }}
        run: |
          set +e          # GitHub injects `bash -e` into run steps — neutralize it:
                          # we capture the gitleaks RCs ourselves so a findings-failure
                          # still writes its leg status (counts) for the receipts job
          set -uo pipefail
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks

          # 13-e: history verdict = the checked-out (canonical) branch's lineage ONLY.
          # gitleaks defaults to `git log --all` — stale side-refs (dead branches of
          # the same lineage) were dyeing the verdict red while the live line was
          # clean (measured 2026-10-07: steem@main orphan = 32 false findings).
          # Repos may carry their own .gitleaks.toml (steem: books allowlist, R244).
          CFG=""
          [ -f scan/.gitleaks.toml ] && CFG="--config .gitleaks.toml"
          ( cd scan && /tmp/gitleaks detect --source . $CFG --log-opts="HEAD" --report-format json --report-path /tmp/gl-history.json --redact --no-banner --log-level error )
          RC_HISTORY=$?
          ( cd scan && /tmp/gitleaks detect --no-git --source . $CFG --report-format json --report-path /tmp/gl-head.json --redact --no-banner --log-level error )
          RC_HEAD=$?

          count_of() { python3 -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "$1" 2>/dev/null || echo "-1"; }
          COUNT_HISTORY=$(count_of /tmp/gl-history.json)
          COUNT_HEAD=$(count_of /tmp/gl-head.json)
          echo "gitleaks findings (history, post-.gitleaksignore): ${COUNT_HISTORY}"
          echo "gitleaks findings (HEAD-only): ${COUNT_HEAD}"
          if [ "${COUNT_HISTORY}" != "0" ] || [ "${COUNT_HEAD}" != "0" ]; then
            # shapes only (rule id + file path) — no secret material ever
            python3 - <<'SHAPEEOF'
          import json
          for tag, path in (("history", "/tmp/gl-history.json"), ("head", "/tmp/gl-head.json")):
              try:
                  rows = sorted({(f.get('RuleID'), f.get('File'), f.get('StartLine')) for f in json.load(open(path))})
              except Exception:
                  continue
              for rule, f, line in rows:
                  print(f'shape[{tag}]: rule={rule} file={f}:{line}')
          SHAPEEOF
          fi
          CONCLUSION=success
          if [ "$RC_HISTORY" -ne 0 ] || [ "$RC_HEAD" -ne 0 ] || [ "${COUNT_HISTORY}" = "-1" ] || [ "${COUNT_HEAD}" = "-1" ]; then CONCLUSION=failure; fi
          python3 - "$REPO" "$COUNT_HISTORY" "$COUNT_HEAD" "$CONCLUSION" <<'PYEOF'
          import json, sys
          repo, hist, head, conclusion = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          with open(f"/tmp/gl-status/{repo}.json", "w") as fh:
              json.dump({"repo": repo, "findingsHistory": hist, "findingsHead": head, "conclusion": conclusion}, fh)
          PYEOF
          # כנות: קוד-היציאה של הרגלה = הראשון-מבין-השניים שנכשל — גם היסטוריה
          # לא-מטופלת וגם HEAD מלוכלך מאדימים את הרגלה (מעבר ל-conclusion בסטטוס).
          if [ "$RC_HISTORY" -ne 0 ]; then exit "$RC_HISTORY"; fi
          exit "$RC_HEAD"

      - name: Upload leg status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-leg-${{ matrix.repo }}
          path: /tmp/gl-status/${{ matrix.repo }}.json
          if-no-files-found: error

  receipts:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Domain
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download leg statuses
        uses: actions/download-artifact@v4
        with:
          pattern: gitleaks-leg-*
          merge-multiple: true
          path: /tmp/gl-status

      - name: Merge into receipts/gitleaks/STATUS.json (counts only)
        run: |
          cat > /tmp/merge_receipts.py <<'PYEOF'
          import json, os, sys, glob, datetime

          REPOS = ["Adsmarket", "Console", "Domain", "Defi", "Project-files", "Saosmartwallet", "Sdk", "Zip", "anchor-baseline", "roshpina", "saos-control-center", "saos-dex", "saos-jummper", "saos-sovereign-foundry", "saos-sovereign-platform", "steem"]

          found = {}
          for p in glob.glob("/tmp/gl-status/*.json"):
              try:
                  d = json.load(open(p))
                  found[d.get("repo")] = d
              except Exception:
                  pass

          repos, missing = {}, []
          for r in REPOS:
              d = found.get(r)
              if d and d.get("conclusion") in ("success", "failure") \
                 and isinstance(d.get("findingsHistory"), int) and isinstance(d.get("findingsHead"), int):
                  repos[r] = {"findingsHistory": d["findingsHistory"], "findingsHead": d["findingsHead"], "conclusion": d["conclusion"]}
              else:
                  repos[r] = {"findingsHistory": None, "findingsHead": None, "conclusion": "missing"}
                  missing.append(r)

          out = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "workflow": "org-gitleaks",
              "verdict": "dual history+HEAD (13-d2); history counts are post-.gitleaksignore (triaged)",
              "repos": dict(sorted(repos.items())),
          }
          os.makedirs("receipts/gitleaks", exist_ok=True)
          with open("receipts/gitleaks/STATUS.json", "w") as fh:
              json.dump(out, fh, indent=2, ensure_ascii=False)
              fh.write("\n")

          hist_total = sum(r["findingsHistory"] or 0 for r in repos.values())
          head_total = sum(r["findingsHead"] or 0 for r in repos.values())
          print(f"repos={len(REPOS)} missing={len(missing)} history_total={hist_total} head_total={head_total}")
          for r, v in repos.items():
              print(f"  {r}: history={v['findingsHistory']} head={v['findingsHead']} conclusion={v['conclusion']}")
          open("/tmp/receipt-summary.txt", "w").write(f"16 repos \u00b7 head={head_total} \u00b7 history={hist_total}")
          open("/tmp/receipt-missing.txt", "w").write(",".join(missing))
          PYEOF
          python3 /tmp/merge_receipts.py

      - name: Commit receipt (agents-watch convention — identity + rebase-retry ×3)
        run: |
          set -uo pipefail
          if [ -z "$(git status --porcelain receipts/gitleaks/STATUS.json)" ]; then
            echo "receipt unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "gitleaks-hub[bot]"
          git config user.email "gitleaks-hub[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add receipts/gitleaks/STATUS.json
            git commit -m "org-gitleaks: $(cat /tmp/receipt-summary.txt) · $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            if git push; then echo "receipt committed (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-merging"
            git reset --hard origin/main
            python3 /tmp/merge_receipts.py
            if [ -z "$(git status --porcelain receipts/gitleaks/STATUS.json)" ]; then
              echo "receipt now identical to origin - nothing to commit"
              exit 0
            fi
          done
          echo "ERROR: could not commit the receipt after 3 attempts"
          exit 1

      - name: Honest gate — every leg must have reported
        run: |
          MISS="$(cat /tmp/receipt-missing.txt)"
          if [ -n "$MISS" ]; then
            echo "MISSING LEGS (no status artifact): ${MISS}"
            exit 1
          fi
          echo "all 16 legs reported"
