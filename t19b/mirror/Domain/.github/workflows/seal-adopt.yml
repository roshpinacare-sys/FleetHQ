name: seal-adopt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seal-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the sovereign home
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Adopt the operator's delivered master key as the seal passphrase
        env:
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
        run: node scripts/seal-adopt.mjs
