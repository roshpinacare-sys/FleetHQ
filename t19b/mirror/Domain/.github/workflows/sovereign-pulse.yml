# sovereign-pulse.yml (Domain) — R16-a: THE SOVEREIGN PULSE ON-CHAIN.
#
# Owner mandate trace 1a1…ff11 ("מה אפשר להקים על הבלוקצ'יין שלנו? — הריבונות
# מורשית להשתמש בבלוקצ'יין להקים פרויקטים"). התשובה: קיום-הריבונות עצמו, רשום-אמת.
# כל-שעתיים המנוע מודד את מצב-הצי (profit-oracle receipt + פסק-הגריד-הציבורי) ומחתים
# אותו על-Steem כ-custom_json מוחתם-posting של האוצר (עלות-אפס — RC בלבד). כל-צומת-בעולם
# יכול לאמת מהשרשרת שהריבונות חיה, מתי נמדדה, ומה-נמדד — בלי-לסמוך על אף-שרת שלנו.
#
# בטיחות: STASIS gate (lane general) · שער-מפתח-posting מול-הרשות-החיה (fail-closed —
# מפתח-ישן = אפס-שידור) · heartbeat-only כשהמקורות-כהים (אפס-מספרים-מומצאים) ·
# קריאה-אחרי-כתיבה · אפס-סודות-בקבלה. הקבלות נדחפות לבית-הגריד (saos-dex).
name: sovereign-pulse

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sovereign-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout the sovereign chain home
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/saos-dex
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: STASIS gate (mechanical, FATE-DEFENSE law)
        run: |
          set -eu
          S=$(node -e "const s=JSON.parse(require('fs').readFileSync('grids/state/STASIS.json','utf8'));const ok=s.active!==true||(Array.isArray(s.stagedLanes&&s.stagedLanes.allow)&&s.stagedLanes.allow.map(String).map(x=>x.toLowerCase()).includes('general'));console.log(ok?'open':'halt')")
          echo "stasis=$S"
          if [ "$S" = "halt" ]; then echo "STASIS-HALT sovereign-pulse — the breaker is active (lane general closed)"; exit 0; fi

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Sovereign pulse (posting-auth custom_json attestation; fail-closed on key)
        env:
          SAOS_RELAY_AGENT_ACCOUNT: headcorner
          STEEM_POSTING_WIF: ${{ secrets.STEEM_POSTING_WIF }}
        run: |
          set -Eeuo pipefail
          set +e
          node grids/sovereign-pulse.mjs --selftest || { echo "selftest RED — refusing to pulse"; exit 1; }
          node grids/sovereign-pulse.mjs --execute
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "pulse honestly failed (RC=$RC) — the receipt says why; the next beat retries. Fail-closed is success-of-safety, not of pipe."
          fi
          exit 0

      - name: Pulse evidence commit (receipt = commit)
        run: |
          set -u
          git config user.name "sovereign-pulse[bot]"
          git config user.email "sovereign-pulse[bot]@users.noreply.github.com"
          git add grids/state/sovereign-pulse.jsonl grids/state/events.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no pulse evidence change — clean exit"
          else
            git commit -m "sovereign-pulse: on-chain attestation receipt $(date -u +%FT%TZ) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break || { sleep $((i*5)); git rebase --abort 2>/dev/null || true; }
            done
          fi
