#
#

name: sovereign-selftests

on:
  schedule:
    - cron: '9 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-selftests
  cancel-in-progress: false

jobs:
  platform-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout saos-sovereign-platform
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/saos-sovereign-platform
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Edge engine selftest (same checks as the original)
        run: |
          set -u
          ST_EXIT=1
          if python3 python/irrigation_engine.py selftest > /tmp/selftest.log 2>&1; then ST_EXIT=0; fi
          tail -15 /tmp/selftest.log
          RULES=1
          if python3 python/irrigation_engine.py rules > /tmp/rules.log 2>&1; then RULES=0; fi
          tail -8 /tmp/rules.log
          [ "$ST_EXIT" = "0" ] && [ "$RULES" = "0" ]

  jumpper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout saos-jummper
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/saos-jummper
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Notary unit tests (same checks as the original)
        run: |
          set -u
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt || pip install --quiet requests; else pip install --quiet requests; fi
          pip install --quiet -e . 2>/dev/null || true
          export PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q src

  sdk-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout Sdk
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Sdk
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1
      - name: Content integrity (same checks as the original)
        run: |
          set -u
          DOCS=0; BCASTS=0
          [ -d docs ] && DOCS=1
          [ -d broadcasts ] && BCASTS=1
          DOCS_FILES="$({ find docs -type f 2>/dev/null || true; } | wc -l | tr -d ' ')"
          BC_FILES="$({ find broadcasts -type f 2>/dev/null || true; } | wc -l | tr -d ' ')"
          echo "docs=$DOCS($DOCS_FILES) broadcasts=$BCASTS($BC_FILES)"
          if [ "$DOCS" -eq 0 ] && [ "$BCASTS" -eq 0 ]; then echo "both docs and broadcasts missing"; exit 1; fi
          if [ "$DOCS" -eq 1 ] && [ "$DOCS_FILES" -eq 0 ]; then echo "docs directory is empty"; exit 1; fi
          if [ "$BCASTS" -eq 1 ] && [ "$BC_FILES" -eq 0 ]; then echo "broadcasts directory is empty"; exit 1; fi
          find docs broadcasts -type f 2>/dev/null | LC_ALL=C sort | xargs -r sha256sum > manifest.sha256
          echo "manifest written: $(wc -l < manifest.sha256) entries"

  wallet-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Saosmartwallet
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Saosmartwallet
          ref: main
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Wallet quality gate (same checks as the original)
        run: |
          set -u
          if [ -f bun.lock ]; then bun install --frozen-lockfile; else bun install; fi
          if [ -f prisma/schema.prisma ]; then bunx prisma generate; fi
          if [ -f tsconfig.json ]; then bunx tsc --noEmit; fi
          if grep -q '"build"' package.json; then
            [ -f .env.example ] && cp .env.example .env
            if grep -q "webpack" next.config.* 2>/dev/null; then
              bunx next build --webpack
            else
              bunx next build
            fi
          fi
