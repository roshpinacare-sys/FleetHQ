#
#
# This workflow is that law, 24/7:
#     fires LIVE — verify-then-sign + caps + band + ADD-ONLY still bind inside
#

name: sovereign-tick-cron

on:
  schedule:
    - cron: '49 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sovereign-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NODE_PATH: /tmp/steemjs/node_modules
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: STASIS gate (mechanical, FATE-DEFENSE law #1)
        id: stasis
        run: |
          ACTIVE=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('agents/STASIS.json','utf8')).active)}catch(e){console.log('false')}")
          echo "active=${ACTIVE}" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "true" ]; then
            echo "STASIS is ACTIVE — the sovereign tick halts before any read (healthy no-op receipt below)"
          fi

      - name: Node 20
        if: steps.stasis.outputs.active != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: steem client (steem@0.7.11 — the fleet signer, needed only by an ARMED LIVE leg)
        if: steps.stasis.outputs.active != 'true'
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/steemjs/node_modules node -e "require('steem'); console.log('steem-js OK')"

      - name: drip canon (D2 fuel readback — keyless on-chain powerdown state; Z-67, CR-0045)
        if: steps.stasis.outputs.active != 'true'
        run: node agents/drip-canon.cjs

      - name: convert canon (maturity schedule — sensor memory + fresh walk; Z-71, CR-0050)
        if: steps.stasis.outputs.active != 'true'
        run: node agents/convert-canon.cjs

      - name: sovereign tick (keyless = DRY receipts · armed = LIVE per policy · STASIS = halt)
        if: steps.stasis.outputs.active != 'true'
        env:
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          HC_DERIVED: ${{ github.workspace }}/.fleet/headcorner-derived.json
          SOVEREIGN_DRIP_JSON: ${{ github.workspace }}/agents/sovereign-drip.json
        run: |
          if [ -n "$STEEM_ACTIVE_WIF" ] && [ "${#STEEM_ACTIVE_WIF}" -ge 40 ]; then
            mkdir -p .fleet
            node -e "
              const fs=require('fs');
              fs.writeFileSync(process.env.HC_DERIVED, JSON.stringify({steem:{active:process.env.STEEM_ACTIVE_WIF}}));
              console.log('vault materialized from the repository secret (presence-only; content never logged)');
            "
            echo "SOVEREIGN-ARMED: the dual-gate 'with the key' path is live; verify-then-sign still binds in market-exec"
          else
            echo "SOVEREIGN-KEYLESS: STEEM_ACTIVE_WIF absent in this repository vault — honest DRY sovereignty 24/7."
            echo "ARMING (one step, no code): set the secret to the same active key the operator armed runs #9-#13 with."
          fi
          node agents/sovereign-tick.cjs

      - name: STASIS healthy no-op receipt (booked even when halted — the file is the audit trail)
        if: steps.stasis.outputs.active == 'true'
        run: |
          mkdir -p agents
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"ts\":\"$TS\",\"decision\":\"SKIP\",\"reason\":\"STASIS-HALT: breaker active — cron tick halted before any read\",\"tier\":\"S\",\"gate\":\"cron-stasis\"}" >> agents/sovereign-decisions.jsonl
          echo "$TS STASIS-HALT receipt booked"

      - name: publish receipts (append-only, [skip ci], rebase-push twin idiom)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "saos-sovereign"
          git config user.email "sovereign@saos.local"
          for p in agents/sovereign-decisions.jsonl agents/sovereign-state.json agents/sovereign-pending.json agents/sovereign-drip.json agents/convert-canon.json agents/convert-canon.md agents/fill-ledger.json agents/fill-ledger-fills.jsonl agents/fill-ledger.md agents/market-cycle.json agents/market-cycle.md agents/market-exec.json agents/market-exec.md; do
            [ -e "$p" ] && git add "$p" || true
          done
          if git diff --cached --quiet; then
            echo "no sovereign changes"
          else
            git commit -m "sovereign-tick: decision receipts [skip ci]"
            ok=0
            for i in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              echo "push attempt $i failed (concurrent commits on main) — re-pulling"
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            [ "$ok" = "1" ] && echo "sovereign receipts pushed" || echo "receipts landed locally; next tick re-attempts (fail-soft)"
          fi
