#
#

name: weave-anchor-lines

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'anchor mode — auto: anchor the latest checkpoint root on both lines if not yet anchored; dry: build payloads, broadcast nothing; verify-only: keyless readback, never broadcast'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - dry
          - verify-only
      recover:
        description: 'recovery — txid (0x…64hex) of an on-chain ZERO anchor whose push reddened pre-verification: re-verify payload from chain and write the attestation'
        required: false
        type: string
      chain:
        description: 'self-recall chain (R251.2 keeper): dispatches the next cycle at the next :33 — anti-scheduler-starvation (GitHub dropped 7 hourly firings 06:27→13:33 on 2026-10-08). Manual dispatches spawn a chain ONLY with chain=true.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

concurrency:
  group: weave-anchor-lines-domain-twin
  cancel-in-progress: false

jobs:
  anchor-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the sovereign home
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/Zip
          token: ${{ secrets.ZIP_PAT }}
          fetch-depth: 1

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile --no-save 2>/dev/null || bun install --no-save

      - name: Prisma client + DB skeleton
        run: bunx prisma generate && bunx prisma db push
        env:
          DATABASE_URL: 'file:${{ github.workspace }}/db/custom.db'

      - name: Web-upload priority guard (honest skip while inbox pending)
        id: webguard
        run: |
          PENDING=$(ls sovereign/web/inbox/*/job.json 2>/dev/null | wc -l)
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          if [ "$PENDING" -gt 0 ]; then
            echo "דואר נכנס של רשת-האחסון לא ריק ($PENDING חבילות) — תקציב ה-RC מוקדש לשידור התוכן. הקווים יעגנו במחזור הבא."
          else
            echo "דואר נכנס ריק — הקווים פועלים כסדרם"
          fi

      - name: Refuse honestly while the signing secret is absent
        id: sealguard
        env:
          SEAL_PP: ${{ secrets.WEAVE_SEAL_PASSPHRASE || secrets.MAIN_KEY }}
        run: |
          if [ -z "$SEAL_PP" ]; then
            echo "Neither WEAVE_SEAL_PASSPHRASE nor MAIN_KEY is set in this repository's vault"
            echo "(Settings > Secrets and variables > Actions). The canonical name is preferred;"
            echo "MAIN_KEY is the operator's delivered alias (2026-09-21, both accepted)."
            echo "Both evidence lines verify the ledger before anchoring (every checkpoint root is signed by"
            echo "the network key sealed inside the envelope) — without the passphrase there is no honest"
            echo "anchor run, not even a keyless readback (measured: --verify-only fails at the seal too)."
            echo "The machine refuses honestly, without touching anything, until the operator delivers it."
            echo "See README - the machine twin."
            echo "seal=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "seal=present" >> "$GITHUB_OUTPUT"

      - name: Line 1 — Steem/Hive anchor (external witness, posting authority)
        id: steem
        if: steps.webguard.outputs.pending == '0'
        continue-on-error: true
        run: |
          MODE_FLAG=""
          case "${{ inputs.mode }}" in
            dry) MODE_FLAG="--dry" ;;
            verify-only) MODE_FLAG="--verify-only" ;;
          esac
          bun scripts/weave-anchor.ts $MODE_FLAG
        env:
          DATABASE_URL: 'file:${{ github.workspace }}/db/custom.db'
          WEAVE_STEEM_WIF: ${{ secrets.WEAVE_STEEM_WIF }}
          WEAVE_HIVE_WIF: ${{ secrets.WEAVE_HIVE_WIF || secrets.HIVE_POSTING_WIF }}
          WEAVE_SEAL_PASSPHRASE: ${{ secrets.WEAVE_SEAL_PASSPHRASE || secrets.MAIN_KEY }}
          BLURT_ACTIVE_WIF: ${{ secrets.BLURT_ACTIVE_WIF }}

      - name: Line 2 — Zero-gas EVM anchor on Z Chain 9369
        id: zero
        if: steps.webguard.outputs.pending == '0'
        continue-on-error: true
        run: |
          MODE_FLAG=""
          case "${{ inputs.mode }}" in
            dry) MODE_FLAG="--dry" ;;
            verify-only) MODE_FLAG="--verify-only" ;;
          esac
          if [ -n "${{ inputs.recover }}" ]; then MODE_FLAG="--recover=${{ inputs.recover }}"; fi
          bun scripts/weave-anchor-zero.ts $MODE_FLAG
        env:
          DATABASE_URL: 'file:${{ github.workspace }}/db/custom.db'
          WEAVE_SEAL_PASSPHRASE: ${{ secrets.WEAVE_SEAL_PASSPHRASE || secrets.MAIN_KEY }}

      - name: Honesty verdict — red if any line failed (skipped-by-guard = green honest skip)
        if: always()
        run: |
          if [ "${{ steps.sealguard.outputs.seal }}" = "missing" ]; then
            echo "סירוב-כנה: ה-seal ממתין למפעיל — אף קו לא רץ"; exit 1
          fi
          if [ "${{ steps.webguard.outputs.pending }}" != "0" ]; then
            echo "דילוג-כנה: העלאת תוכן בעדיפות — אף קו לא רץ המחזור הזה"; exit 0
          fi
          echo "steem: ${{ steps.steem.outcome }} · zero: ${{ steps.zero.outcome }}"
          if [ "${{ steps.steem.outcome }}" = "failure" ] || [ "${{ steps.zero.outcome }}" = "failure" ]; then
            echo "לפחות קו עדות אחד אדום — הריצה אדומה בכנות"; exit 1
          fi
          echo "שני קווי העדות הושלמו"

      - name: Upload anchor reports (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-anchor-reports-domain-twin
          path: |
            sovereign/anchor-report.json
            sovereign/zero-anchor-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Cadence self-recall keeper (anti-scheduler-starvation, R251.2)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_INPUT: ${{ inputs.chain }}
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CHAIN_INPUT" != "true" ]; then
            echo "הפעלה ידנית ללא chain=true — לא נולדת חוליה (מכוון)"; exit 0
          fi
          S=$(( (33*60 - 10#$(date -u +%M)*60 - 10#$(date -u +%S) + 86400) % 3600 ))
          [ "$S" -lt 30 ] && S=$((S + 3600))
          JITTER=$(( (RANDOM % 50) + 20 ))
          TOTAL=$((S + JITTER))
          echo "ישן ${TOTAL}s עד :33 הבא +jitter"
          sleep "$TOTAL"
          PENDING=$(gh api "repos/roshpinacare-sys/Domain/actions/workflows/weave-anchor-lines.yml/runs?per_page=5&status=in_progress" --jq '.total_count' 2>/dev/null || echo 1)
          QUEUED=$(gh api "repos/roshpinacare-sys/Domain/actions/workflows/weave-anchor-lines.yml/runs?per_page=5&status=queued" --jq '.total_count' 2>/dev/null || echo 1)
          if [ "${PENDING:-1}" != "0" ] || [ "${QUEUED:-1}" != "0" ]; then
            echo "שומר-חי אחר קיים (in_progress/queued) — לא מכפילים שרשרת"; exit 0
          fi
          gh workflow run weave-anchor-lines --ref "${GITHUB_REF_NAME}" -f mode=auto -f chain=true -f recover=""
          echo "חוליה R251.2 הועברה — הקצב חי בלי המתזמן"
