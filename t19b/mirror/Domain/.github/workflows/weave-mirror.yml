#
#

name: weave-mirror

on:
  schedule:
    - cron: '38 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weave-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mirror the live weave books (keyless public read)
        run: node agents/weave-mirror.mjs

      - name: Publish the mirrored books
        if: always()
        run: |
          git config user.name "weave-mirror"
          git config user.email "weave-mirror@users.noreply.github.com"
          git add mirror.json saos-live.json status.json
          if git diff --cached --quiet; then
            echo "mirror unchanged - the live books are already ours"
            exit 0
          fi
          for attempt in 1 2 3; do
            git add mirror.json saos-live.json status.json
            git commit -m "weave-mirror: $(date -u +%Y-%m-%dT%H:%M:%SZ) · weave books mirrored from the live Console home (keyless) [skip ci]"
            git pull --rebase origin main
            if git push; then echo "mirror published (attempt ${attempt})"; exit 0; fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-mirroring"
            git checkout -- .
            git reset --hard origin/main
            node agents/weave-mirror.mjs
            git add mirror.json saos-live.json status.json
            if git diff --cached --quiet; then
              echo "after re-mirror there is nothing to commit - the live books are already ours"
              exit 0
            fi
          done
          echo "ERROR: could not publish the mirror after 3 attempts"
          exit 1
