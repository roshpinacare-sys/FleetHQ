# office-3d.yml — אופה את החדר התלת-ממדי ומפרסם את פריימיו לחלון הציבורי.
# (Task 11-a — modeled EXACTLY on the measured pattern of office-window.yml.)
# אין סודות: ההרשאה היחידה היא GITHUB_TOKEN (contents:write).
# כנות: כשל-WebGL → קבלת-כשל ב-receipts/office-3d/log.jsonl + exit 1;
# החלון נשאר עם תוכנו הקודם — לעולם לא ירוק-מזויף ולא פריימי-מקום.
# אותה קבוצת-מקביליות של החלון — שני-הפרסומים מתורים, אף-קונץ-דריכה.
name: office-3d

on:
  schedule:
    - cron: "47 6 * * *"   # daily 06:47 UTC (offset אחרי office-window 06:17 — כבישת-הקונץ)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/hq/**"
      - "src/lib/hq/**"
      - "src/components/agent-hq/**"
      - "tools/office-3d-bake.mjs"
      - "tools/office-state-capture.ts"
      - "office-window/render.mjs"
      - "office-window/publish-3d.sh"
      - ".github/workflows/office-3d.yml"
      - "receipts/office-state-mirror.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: office-pages-publish
  cancel-in-progress: false

jobs:
  bake-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (full history — branch worktree + rebase needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile — includes the puppeteer devDep)
        run: bun install --frozen-lockfile

      - name: Prisma generate (the app build needs the client)
        run: bunx prisma generate

      - name: Bake the 3D room (build + serve :3210 + headless WebGL frames)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: node tools/office-3d-bake.mjs

      - name: Fleet digest (read-only GitHub API + public raw docs)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node office-window/fleet-digest.mjs --out office-window/dist/digest.json

      - name: Render office window page (embeds the baked frames + their real stamps)
        if: always()
        run: node office-window/render.mjs --digest office-window/dist/digest.json --out office-window/dist/index.html

      - name: Publish dist + 3D frames to office-pages (rebase-first, no force-push)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash office-window/publish-3d.sh

      - name: Commit honest receipts (latest.json pointer + log) back to main
        if: always()
        run: |
          if [ ! -f receipts/office-3d/log.jsonl ]; then echo "no office-3d receipts — nothing to commit"; exit 0; fi
          git config user.name "office-3d-bot"
          git config user.email "office-3d-bot@users.noreply.github.com"
          # Snapshot THIS run's measured bake receipt before the tree is touched.
          SNAP=/tmp/publish-snap
          rm -rf "$SNAP"; mkdir -p "$SNAP/receipts/office-3d"
          cp -a receipts/office-3d/. "$SNAP/receipts/office-3d/" 2>/dev/null || true
          local_src=$(grep '"ok":true' "$SNAP/receipts/office-3d/log.jsonl" 2>/dev/null | tail -1 | sed -n 's/.*"sourceSavedAt":\([0-9]*\).*/\1/p')
          sibling_stand_down() {
            # duplicate trigger law: a sibling run of the same bake (same
            # sourceSavedAt of the mirrored office-state) may have already
            # published — that is a WIN, not a failure.
            git fetch -q origin main 2>/dev/null || return 1
            if [ -n "$local_src" ] && git show origin/main:receipts/office-3d/log.jsonl 2>/dev/null | grep -q "\"sourceSavedAt\":$local_src"; then
              echo "SIBLING-STAND-DOWN: bake receipt for sourceSavedAt=$local_src already published — honest exit 0"
              return 0
            fi
            return 1
          }
          # publish_once: rebuild the commit on top of fresh origin/main.
          # No rebase → no deterministic conflict when a sibling run already
          # rewrote the shared receipt paths: latest.json takes this run's
          # fresher bake pointer; the append-only log unions both sides
          # (exact-duplicate lines removed). Push is FF-only; rejection retries.
          publish_once() {
            mkdir -p receipts/office-3d
            git show origin/main:receipts/office-3d/latest.json > receipts/office-3d/latest.json 2>/dev/null || : > receipts/office-3d/latest.json
            git show origin/main:receipts/office-3d/log.jsonl   > receipts/office-3d/log.jsonl   2>/dev/null || : > receipts/office-3d/log.jsonl
            cp -a "$SNAP/receipts/office-3d/latest.json" receipts/office-3d/latest.json 2>/dev/null || true
            cat "$SNAP/receipts/office-3d/log.jsonl" >> receipts/office-3d/log.jsonl 2>/dev/null || true
            awk 'NF && !seen[$0]++' receipts/office-3d/log.jsonl > receipts/office-3d/log.jsonl.tmp && mv receipts/office-3d/log.jsonl.tmp receipts/office-3d/log.jsonl
            # only the receipts travel — public/office-state.json is an untracked feed copy by law
            git add receipts/office-3d/
            if git diff --cached --quiet; then return 2; fi
            git commit -q -m "office-3d receipt: bake log + latest.json pointer [skip ci]" || return 1
            git push -q origin main
          }
          ok=0
          # fleet hot-race: siblings push receipts continuously — 8 attempts,
          # growing backoff + jitter absorb the race. Every attempt re-fetches
          # and re-applies from the snapshot; never force, never drops history.
          for i in 1 2 3 4 5 6 7 8; do
            if ! git fetch -q origin main; then sleep $((2 * i + RANDOM % 4)); continue; fi
            if sibling_stand_down; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git reset -q --hard origin/main
            publish_once; rc=$?
            if [ "$rc" = "0" ]; then ok=1; echo "PUSH-OK attempt $i"; break; fi
            if [ "$rc" = "2" ]; then ok=1; echo "no receipt delta (origin already holds this payload) — honest exit 0"; break; fi
            if sibling_stand_down; then ok=1; break; fi
            sleep $((2 * i + RANDOM % 4))
            echo "push attempt $i failed (rc=$rc), retrying"
          done
          if [ "$ok" != "1" ]; then sibling_stand_down || { echo "PUSH-FAILED after retries — bake receipt honest but unpublished"; exit 1; }; fi

      - name: Honest job summary
        if: always()
        run: |
          {
            echo "## office-3d — room bake"
            echo ""
            if [ -f office-window/dist/3d/meta.json ]; then
              node -e "const m=require('./office-window/dist/3d/meta.json');console.log('- capturedAt:',m.capturedAt);console.log('- sourceSavedAt:',new Date(m.sourceSavedAt).toISOString());console.log('- mode:',m.mode,'· honest:',m.honest);console.log('- frames:',(m.frames||[]).length);"
            else
              echo "- meta.json MISSING — the bake failed; the window keeps its previous content (honest fallback, never fake frames)"
            fi
            if [ -f receipts/office-3d/log.jsonl ]; then
              echo "- last log lines:"
              tail -3 receipts/office-3d/log.jsonl | sed 's/^/  /'
            fi
            echo "- page: https://roshpinacare-sys.github.io/FleetHQ/"
          } >> "$GITHUB_STEP_SUMMARY"
