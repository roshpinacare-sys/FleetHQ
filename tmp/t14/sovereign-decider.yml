name: sovereign-decider
description: "עורק-ההכרעה-הריבוני: הריבונות מכריעה בעצמה 24/7 — MEASURE→OPTIONS→SCORE→DECIDE→PUBLISH→VERIFY. keyless · fail-soft · אפס-זיופים [T14]"
on:
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sovereign-decider
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: הכרעה-ריבונית (keyless · כל מספר מדוד · STAGED-EXEC במקום טענת-ביצוע)
        run: python3 ops/sovereign/DECIDER/decider.py

      - name: פרסום state + ledger (append-bounded · אין שכתוב היסטוריה)
        run: |
          git config user.name  "sovereign-decider-bot"
          git config user.email "sovereign-decider-bot@users.noreply.github.com"
          git add ops/sovereign/DECIDER/state.json ops/sovereign/DECIDER/ledger.jsonl
          if git diff --cached --quiet; then
            echo "no changes — honest skip"
          else
            git commit -m "sovereign-decider: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi

      - name: אימות-readback (הפרסום נקרא-חזרה — אנטי-זיופים)
        run: |
          WANT=$(python3 -c "import json;print(json.load(open('ops/sovereign/DECIDER/state.json'))['generatedAt'])")
          GOT=""
          for i in 1 2 3 4 5 6 7 8; do
            sleep 12
            GOT=$(curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/ops/sovereign/DECIDER/state.json?cachebust=$(date +%s)" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('generatedAt',''))" 2>/dev/null || echo "")
            [ "$GOT" = "$WANT" ] && break
          done
          if [ "$GOT" = "$WANT" ]; then
            echo "READBACK-VERIFIED: $WANT מפורסם-ונקרא-חזרה"
          else
            echo "READBACK-WARN: want=$WANT got=$GOT — CDN lag כנה; הפעימה-הבאה תאמת שוב"
          fi
