# עורק-ההכרעה-הריבוני: הריבונות מכריעה בעצמה 24/7 — MEASURE→OPTIONS→SCORE→DECIDE→PUBLISH→VERIFY.
# keyless · fail-soft · אפס-זיופים [T14]
# T16 cron-repair: top-level "description:" is not a valid workflow key — the scheduler
# silently rejected the definition (0 schedule runs 21:34..23:04Z) while dispatch still
# worked. Description moved into this comment; structure now mirrors the proven-firing
# pattern (book-audit/cognition-beat, Domain).
name: sovereign-decider
on:
  schedule:
    - cron: "9,39 * * * *"   # [15a] דקות-אי-זוגיות-פנויות · סגנון-בלוק — הדפוס-היחיד-שנרשם-ונמדד-יורה-בריפו-זה (flow-style: value-scan הפסיק-להירשם — נמדד 00:47/01:17/01:47-הוספו)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sovereign-decider
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: הכרעה-ריבונית (keyless · כל מספר מדוד · STAGED-EXEC במקום טענת-ביצוע)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # [T19-fix] קריאה-עצמית לתיבת-ההוראות בריפו-הפרטי
        run: python3 ops/sovereign/DECIDER/decider.py

      - name: פרסום state + ledger (append-bounded · אין שכתוב היסטוריה)
        run: |
          git config user.name  "sovereign-decider-bot"
          git config user.email "sovereign-decider-bot@users.noreply.github.com"
          git add ops/sovereign/DECIDER/state.json ops/sovereign/DECIDER/ledger.jsonl
          # [15a] לוח-פקודות-המנהל: ACK-חוזר-לגיט כשהיו קבלות
          git add ops/sovereign/DIRECTIVES/board.json
          if git diff --cached --quiet; then
            echo "no changes — honest skip"
          else
            git commit -m "sovereign-decider: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            # [T19-fix] מרוץ-סופרים-מקבילים על הריפו — נסיונות-חוזרים-לפני-כישלון-כן
            OK=0
            for i in 1 2 3 4 5; do
              git pull --rebase -q origin main || true
              if git push; then OK=1; break; fi
              echo "push-race #$i — backoff and retry"
              sleep $((i * 10))
            done
            if [ "$OK" != "1" ]; then echo "PUSH-FAILED-after-retries — fail-closed"; exit 1; fi
          fi

      - name: אימות-readback (הפרסום נקרא-חזרה — אנטי-זיופים)
        run: |
          WANT=$(python3 -c "import json;print(json.load(open('ops/sovereign/DECIDER/state.json'))['generatedAt'])")
          GOT=""
          for i in 1 2 3 4 5 6 7 8; do
            sleep 12
            GOT=$(curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/ops/sovereign/DECIDER/state.json?cachebust=$(date +%s)" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('generatedAt',''))" 2>/dev/null || echo "")
            [ "$GOT" = "$WANT" ] && break
          done
          if [ "$GOT" = "$WANT" ]; then
            echo "READBACK-VERIFIED: $WANT מפורסם-ונקרא-חזרה"
          else
            echo "READBACK-WARN: want=$WANT got=$GOT — CDN lag כנה; הפעימה-הבאה תאמת שוב"
          fi
