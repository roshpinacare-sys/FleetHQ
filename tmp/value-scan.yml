name: value-scan
description: "סריקת-ערך אוטונומית: מה הפוטנציאל · מה פתוח · מה יכול לתת ערך — מדידה-בלבד, אפס זיופים [T13]"
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: value-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: סריקת-ערך (keyless, fail-soft, כנה)
        run: python3 ops/sovereign/VALUE-SCAN/value-scan.py
      - name: פרסום state + ledger (append-bounded)
        run: |
          git config user.name  "value-scan-bot"
          git config user.email "value-scan-bot@users.noreply.github.com"
          git add ops/sovereign/VALUE-SCAN/state.json ops/sovereign/VALUE-SCAN/ledger.jsonl
          if git diff --cached --quiet; then
            echo "no changes — honest skip"
          else
            git commit -m "value-scan: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase -q origin main || true
            git push
          fi
