# contract-check.yml — איבר-החוזה [T28=A4]. ציבורי, אפס-תלות-בסנדבוקס.
# כל-מחזור: קורא את החוזה-המיוצר (state/app/contract.json) ומאמת שהמצב-החי
# בגיט עומד-בו. סטייה = אדום-כנה (לא-מושתק). החוזה-מיוצר-מהקוד ב-gen-contract.mjs.
name: contract-check

on:
  schedule:
    - cron: "23/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "state/app/contract.json"
      - "state/app/engineering.json"

permissions:
  contents: read

concurrency:
  group: contract-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Autonomy
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate contract integrity + live state against contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          (async () => {
          const { readFileSync } = require('node:fs');
          const { createHash } = require('node:crypto');
          const checks = [];
          const add = (name, pass, detail = '') => { checks.push({ name, pass, detail }); console.log(`${pass ? 'PASS' : 'FAIL'} ${name} ${detail}`); };

          // 1. החוזה-קיים ותקין
          let contract;
          try {
            contract = JSON.parse(readFileSync('state/app/contract.json', 'utf8'));
            add('contract: parse', true, `schema=${contract.schema}`);
          } catch (e) { add('contract: parse', false, String(e).slice(0, 120)); process.exit(1); }

          // 2. טג-שלמות פנימי (sha256 של ה-facts — מפתח-גילוי-שחיתות)
          try {
            const stable = (v) => Array.isArray(v) ? v.map(stable) : (v && typeof v === 'object') ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, stable(v[k])])) : v;
            const sha = createHash('sha256').update(JSON.stringify(stable(contract.facts), null, 1)).digest('hex');
            add('contract: integrity sha256', sha === contract.integrity.sha256, `${sha.slice(0, 12)}…`);
          } catch (e) { add('contract: integrity', false, String(e).slice(0, 120)); }

          // 3. עצמיות-החוקים: כל-מפתחות-החוק-הנדרשים
          const need = ['writeLane', 'sovereignGate', 'receiptLaw', 'rotationLaw', 'corruptionQuarantine', 'readCache', 'chainMeasure', 'simSubstrate', 'intentGate', 'gitCage', 'keyLaw', 'repoLaw', 'adoptionMap', 'stateContract'];
          const missing = need.filter((k) => !(k in (contract.facts || {})));
          add('contract: laws present', missing.length === 0, missing.length ? 'missing ' + missing.join(',') : `${need.length} laws`);

          // 4. המצב-החי במקור-האמת (raw ציבורי — אותו-מקור שהכול רואים)
          const raw = async (repo, path) => {
            const r = await fetch(`https://raw.githubusercontent.com/roshpinacare-sys/${repo}/main/${path}`, { headers: { 'User-Agent': 'contract-check/1' } });
            if (!r.ok) throw new Error(`${repo}/${path} -> ${r.status}`);
            return r.text();
          };

          // 5. מפת-האימוצים: מינימום 12 מנגנונים A1..A12
          try {
            const eng = JSON.parse(await raw('Autonomy', 'state/app/engineering.json'));
            const adopted = Object.keys(eng.adopted || {});
            const missingM = contract.facts.adoptionMap.mechanisms.filter((m) => !adopted.includes(m));
            add('live: adoption map >= 12', adopted.length >= contract.facts.adoptionMap.minMechanisms && missingM.length === 0, `adopted=${adopted.length}${missingM.length ? ' missing ' + missingM.join(',') : ''}`);
          } catch (e) { add('live: engineering.json', false, String(e).slice(0, 120)); }

          // 6. קבצי-מצב מהחוזה — קיימים, JSON תקין
          for (const entry of contract.facts.stateContract.validatedPaths) {
            const [repo, path] = entry.split(':');
            try {
              const txt = await raw(repo, path);
              JSON.parse(txt);
              add(`live: ${entry}`, true, `json ok (${txt.length}B)`);
            } catch (e) { add(`live: ${entry}`, false, String(e).slice(0, 120)); }
          }

          // 7. חוק-המלאי: REGISTRY.json נושא schema keys.registry
          try {
            const reg = JSON.parse(await raw('Autonomy', 'state/keys/REGISTRY.json'));
            add('live: keys registry schema', (reg.schema || '').startsWith('keys.registry'), `schema=${reg.schema}`);
          } catch (e) { add('live: keys registry', false, String(e).slice(0, 120)); }

          // 8. חוק-הקבלות: QUEUE.json parse + סדרים-סגורים נושאים קבלה
          try {
            const q = JSON.parse(await raw('ops-intake', 'ops/QUEUE.json'));
            const closed = (q.orders || []).filter((o) => o.status === 'CLOSED');
            const noReceipt = closed.filter((o) => !(o.closedReceipt || o.receipt || '').length && !o.closedVia);
            add('live: closed orders carry receipts', closed.length > 0 ? noReceipt.length === 0 : true, `closed=${closed.length} noReceipt=${noReceipt.length}`);
          } catch (e) { add('live: ops-intake QUEUE', false, String(e).slice(0, 120)); }

          const failed = checks.filter((c) => !c.pass);
          await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json', 'User-Agent': 'contract-check/1' },
            body: JSON.stringify({
              state: failed.length ? 'failure' : 'success',
              context: 'contract-check',
              description: failed.length ? `${failed.length} סטיות-חוזה: ${failed.map((f) => f.name).join(', ')}`.slice(0, 140) : `חוזה-תקף · ${checks.length} בדיקות PASS`,
            }),
          }).catch(() => {});
          process.exit(failed.length ? 1 : 0);
          })().catch((e) => { console.error('contract-check crashed:', String(e).slice(0, 200)); process.exit(1); });
          NODE
