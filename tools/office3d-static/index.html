<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מפקדת הצי — המשרד התלת-מימדי | FleetHQ</title>
    <meta
      name="description"
      content="המשרד החי בתלת-מימד של מפקדת הצי: אור-יום לפי שעון-ירושלים, נוכחות-חיה של הסוכנים, קיר-אמת של הגיט עם מד-טריות — אפס בקאנד, אפס סודות."
    />
    <style>
      /* טעינה טרום-React: רקע אור-יום, אפס הבהוב שחור */
      html, body { margin: 0; background: #f3f1ec; }
    </style>
    <script>
      /* v5-P3⑨ — שער-WebGL כנה: בלי WebGL (או בכשל-יצירה) המבקר מנותב
         מיד לגרסת-הטקסט המלאה (fallback.html) — לעולם לא מסך-שחור שקט.
         הגרסה-השטוחה אינה עוד "הדף הראשי" אלא ה-fallback המקושר של החוויה. */
      (function () {
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl');
          if (!gl) location.replace('./fallback.html?noWebGL=1');
        } catch (e) {
          location.replace('./fallback.html?noWebGL=1');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; padding: 24px; text-align: center" dir="rtl">
        החדר התלת-מימדי דורש JavaScript.
        <a href="./fallback.html" style="color: #8a6d3b">מעבר לגרסת-הטקסט המלאה</a>.
      </div>
    </noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
